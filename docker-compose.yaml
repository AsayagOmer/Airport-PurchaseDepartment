version: '3.8'

services:
  db:
    image: postgres:15
    container_name: dutyfree_db
    environment:
      POSTGRES_USER: dutyfree_user
      POSTGRES_PASSWORD: dutyfree_password
      POSTGRES_DB: dutyfree_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: